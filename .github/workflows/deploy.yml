# Publicación automática de IOGGA en Firebase Hosting.
# Cada vez que se sube código a estas ramas, la app se construye y se publica.
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT en GitHub (Settings -> Secrets).
name: Publicar IOGGA

on:
  push:
    branches:
      - main
      - claude/ai-studio-app-features-rlth7p

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: iogga-b932b
      # Publicar también las REGLAS de Firestore (seguridad de solicitudes/bloqueo).
      # Si la cuenta de servicio no tiene permiso, no rompe el deploy del sitio.
      - name: Publicar reglas de Firestore
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          npx firebase-tools deploy --only firestore:rules --project iogga-b932b --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      # Desplegar el backend de pagos (Functions). Requiere:
      #  1) Plan Blaze activo en Firebase
      #  2) Secreto MP_ACCESS_TOKEN agregado en GitHub (Settings -> Secrets -> Actions)
      # Si falta algo, este paso se salta o falla sin romper el deploy del sitio.
      - name: Desplegar funciones de pago
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.MP_ACCESS_TOKEN }}" ]; then
            echo "Sin secreto MP_ACCESS_TOKEN: se omite el deploy de funciones."; exit 0;
          fi
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          cd functions && npm ci --no-audit --no-fund && cd ..
          printf '%s' "${{ secrets.MP_ACCESS_TOKEN }}" | npx firebase-tools functions:secrets:set MP_ACCESS_TOKEN --project iogga-b932b --data-file=- --force || true
          npx firebase-tools deploy --only functions --project iogga-b932b --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
