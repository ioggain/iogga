# Publicación automática de IOGGA en Firebase Hosting.
# Cada vez que se sube código a estas ramas, la app se construye y se publica.
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT en GitHub (Settings -> Secrets).
name: Publicar IOGGA

on:
  push:
    branches:
      - main
      - claude/ai-studio-app-features-rlth7p

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: iogga-b932b
