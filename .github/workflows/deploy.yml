# Publicación automática de la app de iogga en Firebase Hosting (iogga.com).
#
# Repositorio: ioggain/iogga-app  ·  Rama que se publica: main
#
# Antes de publicar, el código pasa por la puerta de calidad (tipos, pruebas y
# construcción). Si algo falla, NO se publica: la gente se queda con la versión
# anterior, que sí funciona.
#
# Secretos necesarios (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT  - para publicar el sitio y las reglas
#   MP_ACCESS_TOKEN           - para el backend de pagos
name: Publicar IOGGA

on:
  push:
    branches:
      - main
  # Permite relanzar la publicación a mano desde la pestaña Actions,
  # sin tener que subir un cambio vacío.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # PUERTA DE CALIDAD ANTES DE PUBLICAR.
      # Si los tipos, las pruebas o la construcción fallan, el despliegue se
      # DETIENE aquí y la gente sigue con la versión anterior, que funciona.
      # Publicar algo roto es peor que no publicar.
      - name: Revisar tipos
        run: npm run typecheck
      - name: Pruebas de las reglas de negocio
        run: npm test
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: iogga-b932b
      # Publicar también las REGLAS de Firestore (seguridad de solicitudes/bloqueo).
      # Si la cuenta de servicio no tiene permiso, no rompe el deploy del sitio.
      - name: Publicar reglas de Firestore
        id: reglas
        continue-on-error: true
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          npx firebase-tools deploy --only firestore:rules --project iogga-b932b --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      # Desplegar el backend de pagos (Functions). Requiere:
      #  1) Plan Blaze activo en Firebase
      #  2) Secreto MP_ACCESS_TOKEN agregado en GitHub (Settings -> Secrets -> Actions)
      # Si falta algo, este paso se salta o falla sin romper el deploy del sitio.
      - name: Desplegar funciones de pago
        id: funciones
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.MP_ACCESS_TOKEN }}" ]; then
            echo "Sin secreto MP_ACCESS_TOKEN: se omite el deploy de funciones."; exit 0;
          fi
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          cd functions && npm ci --no-audit --no-fund && cd ..
          printf '%s' "${{ secrets.MP_ACCESS_TOKEN }}" | npx firebase-tools functions:secrets:set MP_ACCESS_TOKEN --project iogga-b932b --data-file=- --force || true
          npx firebase-tools deploy --only functions --project iogga-b932b --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

      # AVISO VISIBLE: estos dos pasos no rompen el sitio si fallan (la app ya
      # quedó publicada), pero SÍ tienen que verse. Antes fallaban en silencio y
      # el despliegue salía verde con las reglas o los pagos sin actualizar.
      - name: Resumen del despliegue
        if: always()
        run: |
          echo "## Despliegue de iogga" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- App publicada: OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reglas de seguridad: ${{ steps.reglas.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend de pagos: ${{ steps.funciones.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.reglas.outcome }}" != "success" ]; then
            echo "::warning::Las reglas de seguridad NO se actualizaron. La app está publicada, pero revisa este paso."
          fi
          if [ "${{ steps.funciones.outcome }}" != "success" ]; then
            echo "::warning::El backend de pagos NO se actualizó. La app está publicada, pero los pagos siguen con la versión anterior."
          fi
