# iogga — configuración para Netlify
# El sitio es estático: no hay build, se publican los archivos tal cual.

[build]
  publish = "."
  command = ""

# Cabeceras de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El panel privado nunca debe indexarse
[[headers]]
  for = "/panel.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Direcciones cortas para compartir
[[redirects]]
  from = "/inversion"
  to = "/inversion.html"
  status = 301

[[redirects]]
  from = "/privacidad"
  to = "/privacidad.html"
  status = 301

[[redirects]]
  from = "/terminos"
  to = "/terminos.html"
  status = 301
