<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel — iogga</title>
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="theme-color" content="#0b0b10" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%236366f1'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --primary:#6366f1; --accent:#14b8a6; --amber:#f59e0b;
    --bg:#0b0b10; --panel:#14141c; --panel-2:#1b1b26;
    --line:#2a2a38; --line-2:#3a3a4c;
    --text:#f2f2f7; --muted:#9a9ab0; --muted-2:#6e6e85;
    --f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:15px;
    line-height:1.5;letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
  h1,h2{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1.1}
  button{font-family:inherit}

  .top{position:sticky;top:0;z-index:10;background:rgba(11,11,16,.85);backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line)}
  .top-in{max-width:1120px;margin-inline:auto;padding:0 20px;height:58px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .logo{display:inline-flex;align-items:center;gap:.5rem}
  .logo .mark{width:25px;height:25px;border-radius:50%;background:var(--primary);flex:none}
  .logo .word{font-weight:600;font-size:1.25rem;letter-spacing:-.035em}
  .logo .tagp{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;
    color:var(--primary);border:1px solid var(--primary);border-radius:6px;padding:.15em .45em;margin-left:.2rem}

  .wrap{max-width:1120px;margin-inline:auto;padding:28px 20px 64px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-size:.88rem;font-weight:500;
    padding:.6em 1.1em;border-radius:10px;border:1px solid var(--line-2);background:var(--panel-2);
    color:var(--text);cursor:pointer;transition:.18s}
  .btn:hover{background:#242433;border-color:#4a4a60}
  .btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .btn-p{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-p:hover{background:#5457e5;border-color:#5457e5}
  .btn-sm{font-size:.8rem;padding:.45em .8em}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* login */
  .gate{max-width:400px;margin:12vh auto 0;padding:0 20px;text-align:center}
  .gate .mark-lg{width:62px;height:62px;margin:0 auto 1.5rem;border-radius:50%;background:var(--primary)}
  .gate h1{font-size:1.7rem;margin-bottom:.5rem}
  .gate p{color:var(--muted);margin:0 0 1.8rem}
  .gate input{width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;
    padding:.85em 1.1em;color:var(--text);font:inherit;font-size:1rem;text-align:center;letter-spacing:.05em}
  .gate input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(99,102,241,.2)}
  .gate .btn{width:100%;margin-top:.7rem;padding:.8em}
  .gate .err{color:#f87171;font-size:.88rem;margin-top:.9rem;min-height:1.2em}
  .gate .hint{margin-top:1.6rem;font-size:.78rem;color:var(--muted-2);line-height:1.5}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  @media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
  .st{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .st .n{font-size:1.9rem;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .st .l{font-size:.76rem;color:var(--muted);margin-top:.35rem;text-transform:uppercase;letter-spacing:.06em}
  .st.a .n{color:var(--primary)} .st.b .n{color:var(--accent)} .st.c .n{color:var(--amber)}

  .bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:16px}
  .bar input[type=search]{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line-2);
    border-radius:10px;padding:.6em 1em;color:var(--text);font:inherit;font-size:.9rem}
  .bar input[type=search]:focus{outline:none;border-color:var(--primary)}
  .spacer{flex:1}

  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:660px}
  th{text-align:left;padding:12px 14px;background:var(--panel-2);color:var(--muted);
    font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;
    position:sticky;top:0}
  td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
  tbody tr:hover{background:rgba(255,255,255,.025)}
  td.date{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:.82rem}
  td.name{font-weight:600}
  td a{color:var(--primary);text-decoration:none}
  td a:hover{text-decoration:underline}
  .chip{display:inline-block;font-size:.7rem;font-weight:600;padding:.22em .6em;border-radius:980px;white-space:nowrap}
  .chip.u{background:rgba(99,102,241,.16);color:#a5a7ff}
  .chip.b{background:rgba(20,184,166,.16);color:#5eead4}
  .chip.m{background:rgba(245,158,11,.16);color:#fcd34d}
  .empty{padding:52px 20px;text-align:center;color:var(--muted)}
  .msg{margin-top:14px;font-size:.85rem;min-height:1.2em}
  .msg.err{color:#f87171}.msg.ok{color:#5eead4}
  .hide{display:none !important}
</style>
</head>
<body>

<!-- Pantalla de acceso -->
<div id="gate" class="gate">
  <div class="mark-lg" aria-hidden="true"></div>
  <h1>Panel privado</h1>
  <p>Lista de espera de iogga</p>
  <form id="gateForm">
    <input type="password" id="key" placeholder="Clave de acceso" autocomplete="current-password" aria-label="Clave de acceso" />
    <button type="submit" class="btn btn-p">Entrar</button>
  </form>
  <div class="err" id="gateErr"></div>
  <p class="hint">Esta página no está enlazada desde el sitio ni la indexan los buscadores.<br>Solo se abre con la clave que configuraste.</p>
</div>

<!-- Panel -->
<div id="app" class="hide">
  <header class="top">
    <div class="top-in">
      <span class="logo"><span class="mark" aria-hidden="true"></span><span class="word">iogga</span><span class="tagp">Panel</span></span>
      <button class="btn btn-sm" id="logout">Salir</button>
    </div>
  </header>

  <div class="wrap">
    <div class="stats">
      <div class="st a"><div class="n" id="sTotal">—</div><div class="l">Registros</div></div>
      <div class="st b"><div class="n" id="sBiz">—</div><div class="l">Negocios</div></div>
      <div class="st c"><div class="n" id="sPhone">—</div><div class="l">Con teléfono</div></div>
      <div class="st"><div class="n" id="sToday">—</div><div class="l">Hoy</div></div>
    </div>

    <div class="bar">
      <input type="search" id="q" placeholder="Buscar por nombre, correo o teléfono…" aria-label="Buscar" />
      <div class="spacer"></div>
      <button class="btn btn-sm" id="reload">Actualizar</button>
      <button class="btn btn-sm" id="copyTxt">Copiar como texto</button>
      <button class="btn btn-sm btn-p" id="dlCsv">Descargar CSV</button>
    </div>

    <div class="tablewrap">
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Fecha</th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Tipo</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty hide" id="empty">Todavía no hay registros.</div>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ====================================================================
     Pega aquí la MISMA URL de Google Apps Script que usa el formulario
     (ver LISTA-DE-ESPERA.md). La clave se pide al entrar.
     ==================================================================== */
  var ENDPOINT = "https://script.google.com/macros/s/AKfycbwrrKtwmkmBGpNFTh9pQHRUyLPQ03f83VSllaV5RRLHJm7r7bO2c5MZl2mSQnTuaLw8/exec";

  var gate = document.getElementById("gate"),
      app  = document.getElementById("app"),
      msg  = document.getElementById("msg"),
      rows = document.getElementById("rows"),
      empty= document.getElementById("empty"),
      data = [];

  function show(kind, text){ msg.className = "msg " + kind; msg.textContent = text; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function fmt(d){
    var t = new Date(d);
    if (isNaN(t)) return esc(d);
    return t.toLocaleString("es-MX", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function chipFor(tipo){
    var t = (tipo || "").toLowerCase();
    if (t.indexOf("negocio") === 0) return '<span class="chip b">Negocio</span>';
    if (t.indexOf("ambos") === 0)  return '<span class="chip m">Ambos</span>';
    return '<span class="chip u">Usuario</span>';
  }

  function render(list){
    rows.innerHTML = list.map(function(r){
      var tel = (r.telefono || "").trim();
      return "<tr>" +
        '<td class="date">' + fmt(r.fecha) + "</td>" +
        '<td class="name">' + esc(r.nombre) + "</td>" +
        "<td>" + (r.email ? '<a href="mailto:' + esc(r.email) + '">' + esc(r.email) + "</a>" : "—") + "</td>" +
        "<td>" + (tel ? '<a href="tel:' + esc(tel.replace(/\s/g,"")) + '">' + esc(tel) + "</a>" : "—") + "</td>" +
        "<td>" + chipFor(r.tipo) + "</td>" +
      "</tr>";
    }).join("");
    empty.classList.toggle("hide", list.length > 0);
  }

  function stats(list){
    var hoy = new Date().toDateString(), biz = 0, ph = 0, td = 0;
    list.forEach(function(r){
      var t = (r.tipo || "").toLowerCase();
      if (t.indexOf("negocio") === 0 || t.indexOf("ambos") === 0) biz++;
      if ((r.telefono || "").trim()) ph++;
      var d = new Date(r.fecha);
      if (!isNaN(d) && d.toDateString() === hoy) td++;
    });
    document.getElementById("sTotal").textContent = list.length;
    document.getElementById("sBiz").textContent   = biz;
    document.getElementById("sPhone").textContent = ph;
    document.getElementById("sToday").textContent = td;
  }

  function load(key){
    if (!ENDPOINT){
      show("err", "Falta configurar la URL del script en panel.html (ver LISTA-DE-ESPERA.md).");
      return Promise.reject(new Error("sin endpoint"));
    }
    show("", "Cargando…");
    return fetch(ENDPOINT + "?key=" + encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) throw new Error(j.error || "clave incorrecta");
        data = j.registros || [];
        data.sort(function(a,b){ return new Date(b.fecha) - new Date(a.fecha); });
        stats(data); render(data);
        show("ok", data.length + " registro(s) · actualizado " + new Date().toLocaleTimeString("es-MX"));
        return data;
      });
  }

  /* acceso */
  document.getElementById("gateForm").addEventListener("submit", function(e){
    e.preventDefault();
    var k = document.getElementById("key").value.trim();
    if (!k) return;
    document.getElementById("gateErr").textContent = "Verificando…";
    load(k).then(function(){
      try { sessionStorage.setItem("iogga_key", k); } catch(_){}
      gate.classList.add("hide"); app.classList.remove("hide");
    }).catch(function(err){
      document.getElementById("gateErr").textContent =
        String(err.message).indexOf("endpoint") > -1 ? "Falta configurar la URL del script." : "Clave incorrecta.";
    });
  });

  document.getElementById("logout").addEventListener("click", function(){
    try { sessionStorage.removeItem("iogga_key"); } catch(_){}
    location.reload();
  });

  document.getElementById("reload").addEventListener("click", function(){
    var k = ""; try { k = sessionStorage.getItem("iogga_key") || ""; } catch(_){}
    load(k).catch(function(){ show("err", "No se pudo actualizar."); });
  });

  /* búsqueda */
  document.getElementById("q").addEventListener("input", function(e){
    var t = e.target.value.toLowerCase().trim();
    if (!t) return render(data);
    render(data.filter(function(r){
      return [r.nombre, r.email, r.telefono, r.tipo].join(" ").toLowerCase().indexOf(t) > -1;
    }));
  });

  /* exportar */
  document.getElementById("dlCsv").addEventListener("click", function(){
    var q = function(v){ return '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"'; };
    var csv = ["Fecha,Nombre,Correo,Telefono,Tipo"].concat(
      data.map(function(r){ return [r.fecha, r.nombre, r.email, r.telefono, r.tipo].map(q).join(","); })
    ).join("\r\n");
    var url = URL.createObjectURL(new Blob(["﻿" + csv], { type:"text/csv;charset=utf-8;" }));
    var a = document.createElement("a");
    a.href = url; a.download = "iogga-lista-de-espera-" + new Date().toISOString().slice(0,10) + ".csv";
    a.click(); URL.revokeObjectURL(url);
  });

  document.getElementById("copyTxt").addEventListener("click", function(){
    var txt = data.map(function(r){
      return [fmt(r.fecha), r.nombre, r.email, r.telefono, r.tipo].filter(Boolean).join(" · ");
    }).join("\n");
    navigator.clipboard.writeText(txt)
      .then(function(){ show("ok", "Copiado al portapapeles."); })
      .catch(function(){ show("err", "No se pudo copiar."); });
  });

  /* sesión guardada */
  var saved = ""; try { saved = sessionStorage.getItem("iogga_key") || ""; } catch(_){}
  if (saved){
    load(saved).then(function(){ gate.classList.add("hide"); app.classList.remove("hide"); }).catch(function(){});
  }
})();
</script>
</body>
</html>
